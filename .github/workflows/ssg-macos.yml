name: SSG Remote Support - macOS

# Branded, unsigned macOS build for Strickland Services Group.
# Mirrors flutter-build.yml's build-for-macOS job without signing/notarization,
# then rebrands the bundle: macOS code expects /Applications/<app-name>.app with
# Contents/MacOS/<app-name>, so the bundle and executable are renamed to match
# ssg_brand.rs and the bundle is re-signed ad hoc.
#
# Required repository variable: SSG_RS_PUB_KEY (hbbs id_ed25519.pub)

on:
  workflow_dispatch:
  push:
    tags:
      - "ssg-*"

env:
  MAC_RUST_VERSION: "1.81"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.1"
  SSG_APP_NAME: "SSGRemoteSupport"
  SSG_DISPLAY_NAME: "SSG Remote Support"
  SSG_BUNDLE_ID: "com.stricklandservicesgroup.remotesupport"
  SSG_RS_PUB_KEY: "${{ vars.SSG_RS_PUB_KEY }}"

jobs:
  check-config:
    runs-on: ubuntu-22.04
    steps:
      - name: Require server public key
        run: |
          if [ "$(printf %s "$SSG_RS_PUB_KEY" | base64 -d 2>/dev/null | wc -c)" -ne 32 ]; then
            echo "::error::Repository variable SSG_RS_PUB_KEY must be the hbbs id_ed25519.pub (base64, 32 bytes)."
            exit 1
          fi

  generate-bridge:
    needs: [check-config]
    uses: ./.github/workflows/bridge.yml

  build-macos:
    name: ${{ matrix.job.target }}
    needs: [generate-bridge]
    runs-on: ${{ matrix.job.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-apple-darwin,
              os: macos-15-intel,
              extra-build-args: "",
              arch: x86_64,
              label: Intel,
            }
          - {
              target: aarch64-apple-darwin,
              os: macos-14,
              extra-build-args: "--screencapturekit",
              arch: aarch64,
              label: AppleSilicon,
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          if ! command -v pkg-config &>/dev/null; then
              brew install pkg-config
          fi

      - name: Install NASM
        run: |
          # NASM 2.16.x; 3.x is incompatible with aom and other multimedia libraries.
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Build
        run: |
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
            echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      - name: Rebrand app bundle
        shell: bash
        run: |
          set -euo pipefail
          out=./flutter/build/macos/Build/Products/Release
          mv "$out/RustDesk.app" "$out/$SSG_APP_NAME.app"
          app="$out/$SSG_APP_NAME.app"
          mv "$app/Contents/MacOS/RustDesk" "$app/Contents/MacOS/$SSG_APP_NAME"
          plist="$app/Contents/Info.plist"
          pb() { /usr/libexec/PlistBuddy -c "$1" "$plist"; }
          pb "Set :CFBundleExecutable $SSG_APP_NAME"
          pb "Set :CFBundleName $SSG_APP_NAME"
          pb "Delete :CFBundleDisplayName" 2>/dev/null || true
          pb "Add :CFBundleDisplayName string $SSG_DISPLAY_NAME"
          pb "Set :CFBundleIdentifier $SSG_BUNDLE_ID"
          pb "Set :CFBundleURLTypes:0:CFBundleURLName $SSG_BUNDLE_ID"
          pb "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 $(echo "$SSG_APP_NAME" | tr '[:upper:]' '[:lower:]')"
          pb "Set :NSHumanReadableCopyright Copyright © 2026 Strickland Services Group. Based on RustDesk (AGPL-3.0)."
          # Renaming the executable and editing Info.plist invalidates the seal.
          codesign --force --deep --sign - --preserve-metadata=entitlements "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          "$app/Contents/MacOS/$SSG_APP_NAME" --version

      - name: Create dmg
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          mkdir -p SignOutput
          create-dmg --volname "$SSG_DISPLAY_NAME" \
            --icon "$SSG_APP_NAME.app" 200 190 --hide-extension "$SSG_APP_NAME.app" \
            --window-size 800 400 --app-drop-link 600 185 \
            "SignOutput/$SSG_APP_NAME-$VERSION-${{ matrix.job.arch }}.dmg" \
            "./flutter/build/macos/Build/Products/Release/$SSG_APP_NAME.app"
          shasum -a 256 SignOutput/*.dmg

      - name: Upload dmg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ssg-remote-support-macos-${{ matrix.job.arch }}
          path: ./SignOutput
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/ssg-')
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          tag_name: ${{ github.ref_name }}
          files: ./SignOutput/*.dmg
